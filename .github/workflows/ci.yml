name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Continuous Integration (Lint, Typecheck, Test, Validate, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events_test"
      ADMIN_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events_test?schema=public"
      WORKER_DATABASE_URL: "postgresql://nst_worker:worker_password@localhost:5432/nst_events_test?schema=public"
      TZ: "Asia/Kolkata"
      JWT_SECRET: "ci_test_jwt_secret_minimum_32_characters_long_xxxx"
      COOKIE_SECRET: "ci_test_cookie_secret_min_32_characters_long_xx"
      GOOGLE_CLIENT_ID: "ci-dummy-google-client-id"
      GOOGLE_CLIENT_SECRET: "ci-dummy-google-client-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3001/auth/google/callback"
      EXPO_ACCESS_TOKEN: "mock_token_for_tests"
      AUTH_EVENTS_IP_PEPPER: "ci_test_ip_pepper_minimum_32_characters_long_xxxx"
      METRICS_TOKEN: "ci_test_metrics_token_minimum_32_characters_long_xxxx"

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nst_events
        ports:
          - 5432:5432
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nst_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Schema-to-Migration Parity (Drift Check)
        env:
          SHADOW_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events_shadow"
        run: |
          # Prepare dedicated, isolated shadow database on disposable CI PostgreSQL instance
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "DROP DATABASE IF EXISTS nst_events_shadow;"
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "CREATE DATABASE nst_events_shadow;"
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "DROP DATABASE IF EXISTS nst_events_test;"
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "CREATE DATABASE nst_events_test;"
          ./scripts/check-schema-drift.sh "${SHADOW_DATABASE_URL}"

      - name: CI Environment Setup (Database Preparation)
        run: |
          pnpm --filter @nst/database db:validate
          pnpm --filter @nst/database db:generate
          pnpm --filter @nst/database db:migrate:deploy
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d nst_events_test -c "ALTER ROLE nst_app WITH PASSWORD 'nst_app_password'; ALTER ROLE nst_worker WITH PASSWORD 'worker_password';"
          pnpm --filter @nst/database db:seed
          pnpm --filter @nst/database build

      - name: Run CI Validation
        env:
          DATABASE_URL: "postgresql://nst_app:nst_app_password@localhost:5432/nst_events_test?schema=public"
          ADMIN_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events_test?schema=public"
          WORKER_DATABASE_URL: "postgresql://nst_worker:worker_password@localhost:5432/nst_events_test?schema=public"
        run: pnpm validate:ci

      - name: Build and Smoke-Test Production Docker Images
        run: |
          echo "=== Building Docker Images ==="
          docker build -f docker/Dockerfile.api -t nst-api:ci .
          docker build -f docker/Dockerfile.worker -t nst-worker:ci .

          echo "=== Smoke Testing API Container Startup ==="
          # Note: --network host binds directly to runner host interfaces (Linux-only, supported on ubuntu-latest).
          # Secrets below are ephemeral mock values meeting minimum length constraints for CI smoke tests only.
          docker run -d --name ci-api-smoke \
            --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL }}?schema=public" \
            -e JWT_SECRET="ci_test_jwt_secret_minimum_32_characters_long_xxxx" \
            -e COOKIE_SECRET="ci_test_cookie_secret_min_32_characters_long_xx" \
            -e GOOGLE_CLIENT_ID="ci-dummy" \
            -e GOOGLE_CLIENT_SECRET="ci-dummy" \
            -e GOOGLE_CALLBACK_URL="http://localhost:3001/auth/google/callback" \
            -e AUTH_EVENTS_IP_PEPPER="${{ env.AUTH_EVENTS_IP_PEPPER }}" \
            -e METRICS_TOKEN="${{ env.METRICS_TOKEN }}" \
            -e PORT=3001 \
            nst-api:ci

          API_HEALTHY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "✅ API container started successfully and passed health check"
              API_HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ "$API_HEALTHY" -ne 1 ]; then
            echo "❌ API container failed to pass health check. Logs:"
            docker logs ci-api-smoke
            docker rm -f ci-api-smoke
            exit 1
          fi
          docker rm -f ci-api-smoke

          echo "=== Smoke Testing Worker Container Startup ==="
          docker run -d --name ci-worker-smoke \
            --network host \
            -e DATABASE_URL="${{ env.DATABASE_URL }}?schema=public" \
            -e WORKER_DATABASE_URL="${{ env.DATABASE_URL }}?schema=public" \
            -e EXPO_ACCESS_TOKEN="dummy" \
            nst-worker:ci

          WORKER_HEALTHY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3002/health > /dev/null; then
              echo "✅ Worker container started successfully and passed health check"
              WORKER_HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ "$WORKER_HEALTHY" -ne 1 ]; then
            echo "❌ Worker container failed to pass health check. Logs:"
            docker logs ci-worker-smoke
            docker rm -f ci-worker-smoke
            exit 1
          fi
          docker rm -f ci-worker-smoke

