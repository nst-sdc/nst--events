plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.installreferrer'
version = '1.0.0'

android {
  namespace "expo.modules.installreferrer"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.android.installreferrer:installreferrer:2.2"
}

