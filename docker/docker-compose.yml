services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: nst-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nst_events}
    ports:
      - '${POSTGRES_PORT_BINDING:-127.0.0.1:5440}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nst_events}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: nst_events_pgdata
