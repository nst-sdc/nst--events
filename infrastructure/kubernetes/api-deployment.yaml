apiVersion: apps/v1
kind: Deployment
metadata:
  name: nst-api
  namespace: nst-events
  labels:
    app: nst-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nst-api
  template:
    metadata:
      labels:
        app: nst-api
    spec:
      priorityClassName: nst-events-critical-priority
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nst-n1
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nst-n6
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nst-n7
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until nc -z -w 2 nst-postgres-service 5432; do echo "Waiting for nst-postgres-service:5432..."; sleep 2; done; echo "Postgres is ready."
      containers:
        - name: api
          image: ghcr.io/nst-sdc/nst-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: nst-api-secrets
          startupProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nst-api-service
  namespace: nst-events
  annotations:
    # passhostheader preserves the original Host header forwarded to the backend;
    # sticky.cookie: "false" disables sticky-session cookie behavior.
    # Neither annotation enables SSE flushing or disables response buffering
    # (Traefik handles streaming responses separately).
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie: "false"
spec:
  type: ClusterIP
  selector:
    app: nst-api
  ports:
    - port: 80
      targetPort: 3001
