apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nst-events-ingress
  namespace: nst-events
spec:
  ingressClassName: traefik
  rules:
    - host: events.nstsdc.org
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /clubs
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nst-dashboard-service
                port:
                  number: 80
