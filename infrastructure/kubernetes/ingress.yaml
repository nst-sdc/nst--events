apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nst-events-ingress
  namespace: nst-events
# SSE operational guidance (/v1/events/:id/live, /v1/notifications/live):
# - Endpoints emit Content-Type: text/event-stream and send 30-second application heartbeats.
# - Traefik flushes recognized streaming responses; do not attach buffering or compression middleware to /v1 routes.
# - X-Accel-Buffering: no is an NGINX-specific response header and does not configure Traefik.
# - Node's headersTimeout applies only to incoming request headers and keepAliveTimeout applies only after a response
#   completes; neither controls the lifetime of an active SSE stream.
# - Active-stream idle/write timeouts must be verified at the Node socket, Traefik entrypoint, and Cloudflare Tunnel layers.
spec:
  ingressClassName: traefik
  rules:
    - host: events.nstsdc.org
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /webhooks
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nst-dashboard-service
                port:
                  number: 80
    - host: api.nst-events.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
