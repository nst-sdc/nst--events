apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nst-events-ingress
  namespace: nst-events
spec:
  ingressClassName: traefik
  rules:
    - host: nst-api.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
    - host: nst-dashboard.nstsdc.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nst-dashboard-service
                port:
                  number: 80
