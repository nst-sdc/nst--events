apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: nst-events
spec:
  podSelector:
    matchLabels:
      app: nst-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nst-api
        - podSelector:
            matchLabels:
              app: nst-worker
        - podSelector:
            matchLabels:
              app: nst-migration
      ports:
        - protocol: TCP
          port: 5432
