# Example Kubernetes Secrets for nst-events namespace
# Copy to secrets.yaml (or secrets.local.yaml) and populate with your credentials.
apiVersion: v1
kind: Secret
metadata:
  name: nst-db-admin-secrets
  namespace: nst-events
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "example-db-password-change-me"
  POSTGRES_DB: "nst_events"
  # Dedicated migration connection string with DDL privileges for Prisma migrate deploy
  DATABASE_URL: "postgresql://postgres:example-db-password-change-me@nst-postgres-service:5432/nst_events?schema=public"
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-api-secrets
  namespace: nst-events
type: Opaque
stringData:
  NODE_ENV: "production"
  PORT: "3001"
  # Runtime least-privileged identity (nst_app role with NO DDL, NOBYPASSRLS)
  DATABASE_URL: "postgresql://nst_app:example-nst-app-password-change-me@nst-postgres-service:5432/nst_events?schema=public"
  JWT_SECRET: "example-jwt-secret-min-32-chars-long-change-me"
  COOKIE_SECRET: "example-cookie-secret-min-32-chars-long-change-me"
  GOOGLE_CLIENT_ID: "example-google-client-id"
  GOOGLE_CLIENT_SECRET: "example-google-client-secret"
  GOOGLE_CALLBACK_URL: "https://events.nstsdc.org/auth/google/callback"
  ALLOWED_EMAIL_DOMAINS: "adypu.edu.in,newtonschool.co"
  ALLOWED_ORIGINS: "https://events.nstsdc.org"
  WEB_APP_URL: "https://events.nstsdc.org"
  ALLOW_INSECURE_COOKIES_LOCAL_DEV: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-worker-secrets
  namespace: nst-events
type: Opaque
stringData:
  # Runtime least-privileged worker identity (nst_worker role with NO DDL, NOBYPASSRLS)
  WORKER_DATABASE_URL: "postgresql://nst_worker:example-nst-worker-password-change-me@nst-postgres-service:5432/nst_events?schema=public"
  DATABASE_URL: "postgresql://nst_worker:example-nst-worker-password-change-me@nst-postgres-service:5432/nst_events?schema=public"
  EXPO_ACCESS_TOKEN: "example-expo-access-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-backup-secrets
  namespace: nst-events
type: Opaque
stringData:
  REQUIRE_OFFSITE_BACKUP: "true"
  STORAGE_PROVIDER: "r2"
  R2_ACCOUNT_ID: "example-r2-account-id"
  R2_ACCESS_KEY_ID: "example-r2-access-key-id"
  R2_SECRET_ACCESS_KEY: "example-r2-secret-access-key"
  R2_BUCKET_NAME: "nst-events-db-backups"
  BACKUP_ENCRYPTION_PASSPHRASE: "example-passphrase-min-32-chars-change-me"
  S3_ENDPOINT: ""
