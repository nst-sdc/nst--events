apiVersion: apps/v1
kind: Deployment
metadata:
  name: nst-worker
  namespace: nst-events
  labels:
    app: nst-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nst-worker
  template:
    metadata:
      labels:
        app: nst-worker
    spec:
      priorityClassName: nst-events-critical-priority
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nst-n1
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nst-n6
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nst-n7
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until nc -z -w 2 nst-postgres-service 5432; do echo "Waiting for nst-postgres-service:5432..."; sleep 2; done; echo "Postgres is ready."
      containers:
        - name: worker
          image: ghcr.io/nst-sdc/nst-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: nst-worker-secrets
          startupProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 3002
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
