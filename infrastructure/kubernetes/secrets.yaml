# Kubernetes Secrets Template for nst-events namespace
# Replace all empty string values ("") with actual credentials before applying.
# Never commit real secrets to source control.
apiVersion: v1
kind: Secret
metadata:
  name: nst-db-admin-secrets
  namespace: nst-events
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: ""  # Set strong database password
  POSTGRES_DB: "nst_events"
  DATABASE_URL: ""  # Optional explicit migration URL: postgresql://postgres:<password>@nst-postgres-service:5432/nst_events?schema=public
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-api-secrets
  namespace: nst-events
type: Opaque
stringData:
  NODE_ENV: "production"
  PORT: "3001"
  DATABASE_URL: ""  # Runtime least-privileged role (NO DDL, NOBYPASSRLS): postgresql://nst_app:<password>@nst-postgres-service:5432/nst_events?schema=public
  JWT_SECRET: ""    # Minimum 32 characters
  COOKIE_SECRET: "" # Minimum 32 characters
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
  GOOGLE_CALLBACK_URL: "https://events.nstsdc.org/auth/google/callback"
  ALLOWED_EMAIL_DOMAINS: "adypu.edu.in,newtonschool.co"
  ALLOWED_ORIGINS: "https://events.nstsdc.org"
  WEB_APP_URL: "https://events.nstsdc.org"
  ALLOW_INSECURE_COOKIES_LOCAL_DEV: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-worker-secrets
  namespace: nst-events
type: Opaque
stringData:
  WORKER_DATABASE_URL: "" # Runtime least-privileged worker role: postgresql://nst_worker:<password>@nst-postgres-service:5432/nst_events?schema=public
  DATABASE_URL: "" # Runtime least-privileged worker role: postgresql://nst_worker:<password>@nst-postgres-service:5432/nst_events?schema=public
  EXPO_ACCESS_TOKEN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-backup-secrets
  namespace: nst-events
type: Opaque
stringData:
  R2_ACCOUNT_ID: ""
  R2_ACCESS_KEY_ID: ""
  R2_SECRET_ACCESS_KEY: ""
  R2_BUCKET_NAME: "nst-events-db-backups"
