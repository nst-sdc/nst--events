apiVersion: apps/v1
kind: Deployment
metadata:
  name: nst-dashboard
  namespace: nst-events
  labels:
    app: nst-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nst-dashboard
  template:
    metadata:
      labels:
        app: nst-dashboard
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - nst-n1
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nst-n6
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nst-n7
      containers:
        - name: dashboard
          image: ghcr.io/nst-sdc/nst-dashboard:f7eeb8218ce48c7555b15cc948a799bb9764d22b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nst-dashboard-service
  namespace: nst-events
spec:
  type: ClusterIP
  selector:
    app: nst-dashboard
  ports:
    - port: 80
      targetPort: 3000

