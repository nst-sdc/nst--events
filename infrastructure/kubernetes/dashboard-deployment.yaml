apiVersion: apps/v1
kind: Deployment
metadata:
  name: nst-dashboard
  namespace: nst-events
  labels:
    app: nst-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nst-dashboard
  template:
    metadata:
      labels:
        app: nst-dashboard
    spec:
      priorityClassName: nst-events-critical-priority
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - nst-n1
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nst-n6
            - weight: 20
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - nst-n7
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until nc -z -w 2 nst-api-service 80; do echo "Waiting for nst-api-service:80..."; sleep 2; done; echo "API is ready."
      containers:
        - name: dashboard
          image: ghcr.io/nst-sdc/nst-dashboard:f7eeb8218ce48c7555b15cc948a799bb9764d22b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: INTERNAL_API_URL
              value: "http://nst-api-service.nst-events.svc.cluster.local"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nst-dashboard-service
  namespace: nst-events
spec:
  type: ClusterIP
  selector:
    app: nst-dashboard
  ports:
    - port: 80
      targetPort: 3000

