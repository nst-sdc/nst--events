apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nst-postgres-backups
  namespace: nst-events
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nst-postgres-backup
  namespace: nst-events
spec:
  # Every 6 hours. A daily backup leaves up to 24 hours of registrations
  # exposed to a bad migration or an accidental reset; 6 hours matches the
  # Longhorn snapshot interval and keeps the worst-case loss small.
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Connections from pods to the postgres service ClusterIP are intermittently
      # refused on this cluster, so retry the whole job a few times before giving up.
      backoffLimit: 6
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: nst-postgres-backup
        spec:
          restartPolicy: OnFailure
          # The postgres StatefulSet pins itself to nst-n6, so the backup runs there too.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - nst-n6
          containers:
            - name: backup
              image: postgis/postgis:16-3.4
              envFrom:
                - secretRef:
                    name: nst-db-admin-secrets
              env:
                - name: PGHOST
                  value: nst-postgres-service
                # pg_dump/pg_restore read PGPASSWORD, not POSTGRES_PASSWORD.
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nst-db-admin-secrets
                      key: POSTGRES_PASSWORD
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAYS
                  value: "14"
                - name: DUMP_ATTEMPTS
                  value: "8"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  mkdir -p "$BACKUP_DIR"

                  # Drop dumps left behind by failed runs.
                  find "$BACKUP_DIR" -maxdepth 1 -name 'nst_events_*.dump' -type f -size 0 -print -delete

                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  FILE="$BACKUP_DIR/nst_events_${TS}.dump"

                  attempt=0
                  until pg_dump -Fc -h "$PGHOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$FILE"; do
                    attempt=$((attempt + 1))
                    if [ "$attempt" -ge "$DUMP_ATTEMPTS" ]; then
                      echo "pg_dump failed after ${DUMP_ATTEMPTS} attempts"
                      rm -f "$FILE"
                      exit 1
                    fi
                    echo "pg_dump attempt ${attempt} failed, retrying in 20s..."
                    sleep 20
                  done

                  # Fail the job rather than keep an unreadable dump.
                  pg_restore -l "$FILE" > /dev/null
                  echo "Dump verified: ${FILE} ($(du -h "$FILE" | cut -f1))"

                  find "$BACKUP_DIR" -maxdepth 1 -name 'nst_events_*.dump' -type f \
                    -mtime "+${RETENTION_DAYS}" -print -delete

                  echo "Retained backups:"
                  ls -lh "$BACKUP_DIR"
                  echo "Backup complete."
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: nst-postgres-backups
